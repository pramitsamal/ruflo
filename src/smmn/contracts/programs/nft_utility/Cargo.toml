[package]
name = "nft_utility"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nft_utility"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.0"
anchor-spl = { version = "0.30.0", features = ["token", "associated_token", "metadata"] }
mpl-token-metadata = { version = "4.0.0", features = ["cpi"] }
